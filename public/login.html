<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Planej. Compras</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 40px);
  }
  .login-box { width: 100%; max-width: 360px; padding: 40px 36px; border-top: 3px solid var(--accent); }
  .login-box .brand-logo { display: block; margin: 0 auto 30px; }
  .login-box label { text-align: left; }
  .login-box button { width: 100%; margin-top: 10px; padding: 13px; font-size: 15px; }
</style>
</head>
<body>
  <div style="position:fixed; bottom:16px; right:20px; font-size:11px; color:#555; text-align:right; line-height:1.5; pointer-events:none; user-select:none">
    Desenvolvido por <span style="color:var(--muted)">Leonardo Ian</span>
  </div>
  <div class="card login-box">
    <svg class="brand-logo" width="150" height="60" viewBox="0 0 150 60" role="img" aria-label="SP Planej. Compras">
      <rect x="0" y="6" width="50" height="50" fill="var(--accent)"></rect>
      <text x="25" y="40" font-family="'Barlow Condensed',sans-serif" font-weight="900" font-size="24" fill="#fff" text-anchor="middle">SP</text>
      <text x="60" y="30" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="16" fill="var(--text)">PLANEJ.</text>
      <text x="60" y="50" font-family="'Barlow Condensed',sans-serif" font-weight="900" font-size="16" fill="var(--accent)">COMPRAS</text>
    </svg>
    <form id="form-login">
      <div style="margin-bottom: 12px">
        <label for="login">Usuário</label>
        <input id="login" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
      </div>
      <p class="erro" id="erro" style="display:none; margin-top: 10px"></p>
      <button type="submit" id="btn-entrar">Entrar</button>
    </form>
  </div>

<script>
  // se já tem sessão válida, pula direto pro sistema
  const auth = JSON.parse(localStorage.getItem("pc_auth") || "null");
  if (auth && auth.token) {
    window.location.replace("/index.html");
  }

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const erroEl = document.getElementById("erro");
    const btn = document.getElementById("btn-entrar");
    erroEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Entrando...";
    try {
      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          login: document.getElementById("login").value,
          senha: document.getElementById("senha").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erro ao entrar");
      localStorage.setItem("pc_auth", JSON.stringify(data));
      window.location.replace("/index.html");
    } catch (err) {
      erroEl.textContent = err.message;
      erroEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
