<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque — Planej. Compras</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Estoque</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <div class="content">
  <div class="card">
    <h2>Estoque atual — componentes</h2>
    <p class="muted" style="margin-top: -8px; margin-bottom: 16px">
      Só componentes aparecem aqui (o que se compra). Acabados ficam em Materiais/Nova referência.
      Ao importar, componentes com código novo são cadastrados automaticamente.
    </p>

    <div class="row" style="justify-content: space-between; margin-bottom: 16px">
      <div>
        <label>Importar planilha</label>
        <input type="file" id="input-importar" accept=".xlsx,.xls,.csv">
        <div class="progress-bar" id="progress-importar" style="display:none"><span class="progress-bar-fill" id="progress-importar-fill"></span></div>
        <span class="muted" id="msg-importar"></span>
      </div>
      <div class="row" style="gap: 8px">
        <button type="button" class="secondary" id="btn-exportar">⬇ Exportar estoque atual</button>
        <button type="button" class="secondary" id="btn-modelo">⬇ Baixar modelo de planilha</button>
      </div>
    </div>

    <div style="margin-bottom: 16px; max-width: 340px">
      <label>Pesquisar</label>
      <input type="text" id="input-busca" placeholder="Código ou descrição...">
    </div>

    <table>
      <thead>
        <tr><th>Código</th><th>Descrição</th><th>UMC</th><th>Qtd. atual</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="muted" id="vazio" style="display:none">Nenhum material cadastrado.</p>
  </div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
  document.getElementById("btn-exportar").addEventListener("click", () => {
    const termo = getBusca();
    const linhas = linhasAtuais.filter(
      (l) => !termo || l.codigo.toLowerCase().includes(termo) || l.descricao.toLowerCase().includes(termo)
    );
    const dados = linhas.map((l) => ({
      MATERIAL: l.codigo,
      DESCRICAO: l.descricao,
      UMC: l.umc,
      ESTOQUE: Number(l.qtd_atual),
    }));
    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Estoque");
    XLSX.writeFile(wb, `estoque-atual-planej-compras-${new Date().toISOString().slice(0, 10)}.xlsx`);
  });

  document.getElementById("btn-modelo").addEventListener("click", () => {
    const ws = XLSX.utils.aoa_to_sheet([
      ["MATERIAL", "DESCRICAO", "UMC", "ESTOQUE"],
      ["3001610", "PERFIL BORRACHA RODO ALUM 70CM (14308)", "PC", 120],
      ["9999888", "COMPONENTE NOVO DE EXEMPLO", "CX", 0],
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Estoque");
    XLSX.writeFile(wb, "modelo-estoque-planej-compras.xlsx");
  });

  let linhasAtuais = [];

  function getBusca() {
    return document.getElementById("input-busca").value.trim().toLowerCase();
  }

  async function carregar() {
    linhasAtuais = await api("/api/estoque");
    renderTabela();
  }

  function renderTabela() {
    const termo = getBusca();
    const linhas = linhasAtuais.filter(
      (l) => !termo || l.codigo.toLowerCase().includes(termo) || l.descricao.toLowerCase().includes(termo)
    );
    document.getElementById("tbody").innerHTML = linhas
      .map(
        (l) => `
        <tr data-material-id="${l.material_id}">
          <td>${l.codigo}</td>
          <td>${l.descricao}</td>
          <td>${l.umc}</td>
          <td style="width:140px"><input type="number" step="any" class="input-qtd" value="${formatNum(l.qtd_atual)}"></td>
          <td><button onclick="salvar(${l.material_id})">Salvar</button></td>
        </tr>`
      )
      .join("");
    document.getElementById("vazio").style.display = linhas.length ? "none" : "block";
  }

  async function salvar(materialId) {
    const linha = document.querySelector(`tr[data-material-id="${materialId}"]`);
    const qtdAtual = linha.querySelector(".input-qtd").value;
    const btn = linha.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Salvando...";
    try {
      await api("/api/estoque", {
        method: "POST",
        body: JSON.stringify({ materialId, qtdAtual }),
      });
    } finally {
      btn.disabled = false;
      btn.textContent = "Salvar";
    }
  }

  document.getElementById("input-busca").addEventListener("input", renderTabela);

  document.getElementById("input-importar").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const msgEl = document.getElementById("msg-importar");
    const barWrap = document.getElementById("progress-importar");
    const barFill = document.getElementById("progress-importar-fill");
    if (!file) return;
    msgEl.textContent = "Lendo arquivo...";
    barWrap.style.display = "block";
    barFill.style.width = "0%";
    try {
      const contentBase64 = await fileParaBase64(file);
      const data = await apiUpload("/api/estoque?recurso=importar-simples", { contentBase64 }, (pct) => {
        barFill.style.width = pct + "%";
        msgEl.textContent = `Enviando... ${pct}%`;
      });
      msgEl.textContent =
        `${data.atualizados}/${data.total} atualizados` +
        (data.criados ? ` (${data.criados} cadastrados agora)` : "");
      await carregar();
    } catch (err) {
      msgEl.textContent = err.message;
    } finally {
      barWrap.style.display = "none";
      e.target.value = "";
    }
  });

  carregar();
</script>
</body>
</html>
